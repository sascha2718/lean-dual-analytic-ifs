# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Provenance metadata for the Lean formalisation accompanying
# "On exponential separation of analytic self-conformal sets on the real line"
# (Bárány, Kolossváry and Troscheit). Follows the mathlib-initiative formalization.yaml v0.4
# self-reporting format.

version: "v0.4"

project:
  name: "Exponential separation of analytic self-conformal sets on the real line: Lean formalisation"
  description: >-
    Lean 4 formalisation of the paper "On exponential separation of analytic self-conformal
    sets on the real line" by Balázs Bárány, István Kolossváry and Sascha Troscheit. The planned
    audited statements are the sufficient condition for the strong exponential separation
    condition in terms of the dual natural projection, its explicit criterion and example, the
    open and dense set of strongly exponentially separated systems in the C2 topology, and the
    characterisation of analytic systems conjugated or sub-conjugated to self-similar systems.
  authors:
    - "Balázs Bárány"
    - "István Kolossváry"
    - "Sascha Troscheit"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sascha Troscheit"

classification:
  msc2020: ["28A80", "37C45"]

sources:
  - title: "On exponential separation of analytic self-conformal sets on the real line"
    authors:
      - "Balázs Bárány"
      - "István Kolossváry"
      - "Sascha Troscheit"
    type: "paper"
    location: "Theorems 1.4, 1.5 and 1.12, Proposition 1.8, Sections 2 to 5"
    relationship: "formalizes"
    note: >-
      The paper whose results are formalised here. paper-correspondence.yaml records the
      statement-by-statement correspondence with the Lean declarations. The formalisation and the
      paper are developed by the same authors.
    author_endorsement: "participated"
  - title: "Dimension of self-conformal measures associated to an exponentially separated analytic IFS on R"
    authors:
      - "Ariel Rapaport"
    type: "preprint"
    relationship: "background"
    note: "Source of the exponential separation condition for analytic systems. Its main theorem is not formalised."

related_formalizations: []

status:
  scope: >-
    Audited: Theorem 1.4 (an open and dense set of strongly exponentially separated systems in
    the C2 topology), Theorem 1.5 (the sufficient condition for the strong exponential
    separation condition), Proposition 1.8 (an explicit criterion), the example of Section 1.2.2
    with its dimensions and the local and L^q dimensions of its natural measure, Theorem 1.6
    (Rapaport, in the class of the paper), Corollary 1.7 (for N ≥ 2) and Theorem 1.12 (conjugacy and
    sub-conjugacy to self-similar systems), stated in Challenge.lean and proved in Solution.lean.
    Five of them take results from the literature as explicit hypotheses, stated as in their
    sources and defined identically in Challenge.lean and Solution.lean: Bowen's theorem on Gibbs
    measures (BowenGibbsStatement), Rapaport's Theorem 1.2 with the exact dimensionality of Feng
    and Hu (RapaportMeasureStatement) and Rapaport's Corollary 1.3 (RapaportSetStatement).
    Formalised in the library: the exponential separation conditions and Definition 1.2 (failure
    of the SESC is weak super-exponential
    condensation), Definition 1.9, Theorems 2.2 and 2.3, Lemmas 2.1, 2.4, 2.5, 2.6, 2.7, 2.8,
    2.10, 3.1, 3.2, 4.1, 4.2, 4.3 and 5.1, Corollary 2.9, Proposition 4.4, the bound (4.3) and
    the remark after the conjecture of Section 1 (exact overlaps and sub-conjugation), and the
    local dimension s(Φ) - 1/3 at 0 of the natural measure of the example of Section 1.2.2, for
    a measure with the Gibbs property.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude Code (Anthropic)"
      tool_setup: "Agentic planning of the formalisation and set-up of the repository framework."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Statement design and review of the Challenge statements against the paper."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    AI tools are used in the Lean development, following the principles of the Leiden
    Declaration on the responsible use of artificial intelligence in research. The authors
    review the Challenge statements against the paper and accept responsibility for the
    formalisation.

fidelity:
  divergences: >-
    Maps of the IFS are given by their holomorphic extensions f : ℂ → ℂ, real at the real points
    of B_{2ε}; statements about [0,1] evaluate at real points, where the complex derivatives
    agree with the derivatives of the real restrictions. Finite words are lists and infinite
    words are sequences ℕ → Fin N, read from the left. In Challenge.lean the hypothesis of
    Theorem 1.5, over distinct words of Σ ∪ Σ_* of equal length, is split into finite words of
    the same length and infinite words. Suprema over [0,1] are real iSups of bounded families.
    The Lean proofs of Theorems 1.5 and 2.2 use an internal condensation dichotomy. The paper
    gives the case analysis directly in the proof of Theorem 2.2 in Section 3 and deduces
    Theorem 1.5 by compactness and Lemma 2.5. In the finite-word case the paper uses finite
    order of vanishing, whereas Lean proves equality of all derivatives at the limit point.
    Lean bounds the derivatives of the dual natural
    projection by Cauchy estimates
    instead of the Faà di Bruno formula of Lemma 2.7. Lemma 2.7 itself is formalised with the
    partitions of {1, …, k+1} represented by Mathlib's OrderedFinpartition and φ_i^{(m)} by the
    (m-1)-th derivative of f_i''/f_i'; its proof uses a local primitive of f_i''/f_i' in place of
    log|f_i'|. The space C^ω_ε([0,1]) of Lemma 2.1 is
    modelled by restrictions to B_ε with the topology of uniform convergence on B_ε. In
    Theorem 1.4 the space 𝔖_N is the union over ε > 0 of the IFSs with maps in S^ω_ε(I), as in
    the manuscript; the open set consists of the systems whose dual IFS satisfies the SSC, and of
    all systems when N = 0, where the Lean dual attractor would be empty. The preliminary
    interpolation in the density proof is retained as the internal lemma IFS.lemma_4_2,
    using complex analyticity in the parameter and preserving the fixed-epsilon class.
    Proposition 4.4 is proved with an
    additive perturbation by Gaussian bumps and Cauchy estimates in place of the multiplicative
    perturbation f exp(φψA), with the absolute constant C = 8. In the density step Lean fixes
    uniform derivative bounds before δ, while the paper uses continuity to preserve the strict
    cylinder inclusions. In the remark after the conjecture of Section 1, that a
    non-singleton attractor is infinite is proved from the invariance of Λ under the compositions
    and a pigeonhole argument, without fixed points. Bowen's theorem and Rapaport's Theorem 1.2
    and Corollary 1.3 are hypotheses, stated as in their sources (Rapaport's for real analytic
    maps of [0,1]). The natural measure of the
    example is the image of a Gibbs measure in Bowen's sense of s(Φ) log|f'_{ω₀}(π(σω))|, and the
    bounds on f_w and f_w' for words over {1,2} are proved by induction on the word, with
    polynomial bounds in place of the product estimate. The pressure and s(Φ) come from Fekete's
    lemma. The dimension of a self-conformal measure is its almost everywhere local dimension.
    Theorem 1.6 assumes N > 0. The open set of Corollary 1.7 (N ≥ 2) is the open set of
    Theorem 1.4 intersected with the systems without a common fixed point.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    The statements were written against the paper and checked by the comparator against
    Solution.lean, but have not yet been reviewed by the authors.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem 1.4 (open and dense set of systems satisfying the SESC)"
      lean: "Challenge.audit_sesc_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Generic.OpenDense, for the union class 𝔖_N."
    - source: "Theorem 1.5 (sufficient condition for the SESC)"
      lean: "Challenge.audit_sesc_of_dualProj"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Dichotomy."
    - source: "Proposition 1.8 (explicit sufficient condition)"
      lean: "Challenge.audit_example_criterion"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Criterion."
    - source: "The example of Section 1.2.2"
      lean: "Challenge.audit_example_sesc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Example, with ε = 1/100."
    - source: "Theorem 1.12, first claim (conjugacy to an IFS with a similarity map)"
      lean: "Challenge.audit_conj_similarity"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.Characterisation."
    - source: "Theorem 1.12 (a) (conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_conj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.Characterisation; the hypothesis on the attractor is not needed."
    - source: "Theorem 1.12 (b) (sub-conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_subconj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.Characterisation; the hypothesis on the attractor is not needed."
    - source: "Theorem 1.6 (Rapaport: dimension under the ESC)"
      lean: "Challenge.audit_dim_of_esc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Rapaport assuming Rapaport's Theorem 1.2 and Corollary 1.3 (RapaportMeasureStatement, RapaportSetStatement)."
    - source: "Corollary 1.7 (open and dense set of systems without dimension drop)"
      lean: "Challenge.audit_dim_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.OpenDense assuming Rapaport's results, for N ≥ 2."
    - source: "The example of Section 1.2.2 (dimensions of the attractor and of self-conformal measures)"
      lean: "Challenge.audit_example_dim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Example, assuming Rapaport's results."
    - source: "The remark at the end of Section 1.2.2 (local dimension of the natural measure at 0)"
      lean: "Challenge.audit_example_localDim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.NaturalMeasure assuming Bowen's theorem (BowenGibbsStatement)."
    - source: "The end of Section 1.2.2 (L^q dimensions of the natural measure)"
      lean: "Challenge.audit_example_lq"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Lq assuming Bowen's theorem (BowenGibbsStatement). The statement also asserts that the L^q sums converge and that the liminf defining the L^q spectrum is not a junk value."

acknowledgements: >-
  Lean 4 and Mathlib (leanprover-community), the leanprover comparator, lean4export and nanoda.
