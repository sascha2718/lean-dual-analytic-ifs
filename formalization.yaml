  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude Code (Anthropic)"
      tool_setup: "Agentic planning of the formalisation and set-up of the repository framework."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "agent"
      models: ["GPT-6 (OpenAI)"]
      framework: "Codex (OpenAI)"
      tool_setup: "Review of paper correspondence, challenge minimality and upload support files."
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Statement design and review of the Challenge statements against the paper."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    AI tools are used in the Lean development, following the principles of the Leiden
    Declaration on the responsible use of artificial intelligence in research. The authors
    review the Challenge statements against the paper and accept responsibility for the
    formalisation.

fidelity:
  divergences: >-
    Maps are represented by holomorphic extensions, with complex derivatives at real points.
    Finite and infinite words are separated in Challenge and represented together internally.
    The space analyticSpace represents the manuscript's functions by their restrictions to
    B_epsilon, requiring holomorphy there, continuity on its closure and real values on I.
    The dual attractor is constructed directly by coding rather than Hutchinson's theorem.
    Cauchy estimates replace the Faà di Bruno argument for Lemmas 2.8 and 2.10; Lemma 2.7 is
    proved separately, using a local primitive in place of log|f'|, and is not used thereafter.
    Theorems 1.5 and 2.2 use a condensation dichotomy, splitting on bounded prefix lengths
    and using equality of all derivatives. The manuscript splits into three cases, uses
    finite order of vanishing for finite limit words and derives Theorem 1.5 from Theorem 2.2.
    For equation (3.3), Lean uses norms and a positive interval-length bound.
    Theorem 1.4 uses the union class, as in the manuscript. Its density proof uses the same
    affine interpolation and multiplicative perturbation. Proposition 4.2 uses equal widths,
    corrects the factors 16Q² + 12Q and 8Q to 16Q² + 12Q + 1 and 8Q + 2 for an empty Z,
    supplies the two second-derivative estimates left to the reader and obtains C = 40/m
    for a margin m of f. The manuscript handles an empty Z by adjoining an auxiliary point.
    Lean preserves invariant cylinders by quantitative bounds; the manuscript uses continuity.
    Lemma 5.1 constructs the linearising map as the uniform limit (5.2) and derives its ODE;
    the manuscript starts with the ODE. Theorem 1.12(a) follows the periodic-point argument.
    Part (b) and Theorem 2.3 use general equivalences without the non-singleton assumption.
    Literature inputs are explicit hypotheses, not axioms: a one-sided full-shift
    specialisation of Bowen's theorem and Rapaport's results together with Feng–Hu exact
    dimensionality. The natural measure, not defined in the manuscript, is the image of
    any probability Gibbs measure for s(Phi) log|f'| under the natural projection. Lean
    computes its local dimension at 0 and bounds its L^q dimensions directly, rather than
    invoking Shmerkin's Lemma 1.7. Summability and boundedness needed for the L^q definition
    are proved in the library. The pressure zero is constructed using Fekete's lemma.
    Theorem 1.6 assumes N > 0, and Corollary 1.7 is restricted to N ≥ 2. Measure dimension is
    stated as almost everywhere local dimension. Full statement-level qualifications are
    recorded in paper-correspondence.yaml.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    Automated review compares the challenge statements and the main proof routes with the
    revised working manuscript. This is not independent human review or author approval.
    Mechanical verification of a submitted snapshot is recorded by CI and Palomar, not inferred
    from the correspondence manifest.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem 1.4 (open and dense set of systems satisfying the SESC)"
      lean: "Challenge.audit_sesc_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Generic.OpenDense, for the union class 𝔖_N."
    - source: "Theorem 1.5 (sufficient condition for the SESC)"
      lean: "Challenge.audit_sesc_of_dualProj"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Dichotomy."
    - source: "Proposition 1.8 (explicit sufficient condition)"
      lean: "Challenge.audit_example_criterion"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Criterion."
    - source: "The example of Section 1.2.2"
      lean: "Challenge.audit_example_sesc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Example, with ε = 1/100."
    - source: "Theorem 1.12, first claim (conjugacy to an IFS with a similarity map)"
      lean: "Challenge.audit_conj_similarity"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.Characterisation."
    - source: "Theorem 1.12 (a) (conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_conj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.PeriodicPoints (IFS.theorem_1_12), along the paper's proof, which uses the hypothesis on the attractor. IFS.conjSelfSimilar_iff proves the equivalence without it."
    - source: "Theorem 1.12 (b) (sub-conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_subconj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.PeriodicPoints (IFS.theorem_1_12), whose part (b) is IFS.subConjSelfSimilar_iff from AnalyticESC.Conjugation.Characterisation; the hypothesis on the attractor is not needed."
    - source: "Theorem 1.6 (Rapaport: dimension under the ESC)"
      lean: "Challenge.audit_dim_of_esc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Rapaport assuming Rapaport's Theorem 1.2 and Corollary 1.3 (RapaportMeasureStatement, RapaportSetStatement)."
    - source: "Corollary 1.7 (open and dense set of systems without dimension drop)"
      lean: "Challenge.audit_dim_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.OpenDense assuming Rapaport's results, for N ≥ 2."
    - source: "The example of Section 1.2.2 (dimensions of the attractor and of self-conformal measures)"
      lean: "Challenge.audit_example_dim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Example, assuming Rapaport's results."
    - source: "The remark at the end of Section 1.2.2 (local dimension of the natural measure at 0)"
      lean: "Challenge.audit_example_localDim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.NaturalMeasure assuming Bowen's theorem (BowenGibbsStatement)."
    - source: "The end of Section 1.2.2 (L^q dimensions of the natural measure)"
      lean: "Challenge.audit_example_lq"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Lq assuming Bowen's theorem (BowenGibbsStatement). Summability and boundedness for the L^q definition remain proved in the library, outside the headline statement."

acknowledgements: >-
  Lean 4 and Mathlib (leanprover-community), the leanprover comparator, lean4export and nanoda.
