    AI tools are used in the Lean development, following the principles of the Leiden
    Declaration on the responsible use of artificial intelligence in research. The authors
    review the Challenge statements against the paper and accept responsibility for the
    formalisation.

fidelity:
  divergences: >-
    Maps are holomorphic extensions; derivatives at real points are complex derivatives
    agreeing with the real ones. Challenge separates finite and infinite words, represented
    together internally. Open and dense subsets are relative to the union over admissible radii,
    as in Section 1.1. Proposition 1.8 has an explicit N >= 2 hypothesis in Lean, and Corollary 1.7 omits N = 1. Nonempty IFS hypotheses
    are explicit. Conjugacy is expressed by an intertwining equation for an injective analytic
    coordinate. The function space requires boundary continuity, as in the manuscript, and
    its complete model is a closed subspace of continuous functions on the closure.
    Lean proves Theorem 2.2 first and derives Theorem 1.5 from its infinite-word hypothesis.
    The density proof proves the interpolation removing coincidences and keeps an invariant
    cylinder valid in a neighbourhood before perturbing. The multiplicative bump proof uses
    equal widths, pads an empty Z, controls a product ratio by continuity and supplies the
    estimates left to the reader. Constants may overestimate the displayed choices.
    Literature inputs are explicit hypotheses, not axioms: Bowen's one-sided full-shift
    Gibbs theorem and Rapaport's results together with Feng–Hu exact dimensionality. The
    natural measure is the projection of any probability Gibbs measure for s(Phi) log|f'|.
    Lean expands the local-dimension and Lq calculations, proves the needed special case of
    Shmerkin's ball-mass estimate, and constructs the pressure zero via Fekete's lemma.
    The polynomial example uses 3 c_max < 1 rather than the displayed derivative sum 7/16.
    The non-polynomial example uses the principal complex square root and compactness to
    choose a common admissible radius. Remark 2.4 on the Schwarzian dual IFS and Möbius
    conjugacy is intentionally unformalised by author instruction. Full qualifications and
    coverage boundaries are in paper-correspondence.yaml; source fingerprints detect changes
    requiring review and do not certify mathematical equivalence.

review:
  status: "agent-reviewed"
  reviewers: ["Codex (OpenAI, GPT-6 agent)"]
  notes: >-
    Codex compared the statements and main proof routes with ../analytic.tex, identified by the
    source fingerprints. The differences are recorded in paper-correspondence.yaml and fidelity.divergences.
    Author involvement in statement design and review is described under automation.
    This status records agent review, not independent human review or author approval.
    Mechanical verification of a submitted snapshot is recorded by CI and Palomar, not inferred
    from the correspondence manifest.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem 1.4 (open and dense set of systems satisfying the SESC)"
      lean: "Challenge.audit_sesc_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Generic.OpenDense, for the union over admissible radii with the relative C2 topology."
    - source: "Theorem 1.5 (sufficient condition for the SESC)"
      lean: "Challenge.audit_sesc_of_dualProj"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Dichotomy."
    - source: "Proposition 1.8 (explicit sufficient condition)"
      lean: "Challenge.audit_example_criterion"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Criterion, with an explicit N ≥ 2 hypothesis ensuring beta > 0; Proposition 1.8 does not state this restriction."
    - source: "The polynomial example of Section 1.2.2"
      lean: "Challenge.audit_example_sesc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Example, with ε = 1/100."
    - source: "Theorem 1.12, first claim (individual-map linearisation)"
      lean: "Challenge.audit_conj_similarity"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.Characterisation. The endpoint linearises the chosen map only; it does not assert contraction of the other conjugated maps."
    - source: "Theorem 1.12 (a) (conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_conj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.PeriodicPoints (IFS.theorem_1_12), along the paper's proof, which uses the hypothesis on the attractor. IFS.conjSelfSimilar_iff treats singleton attractors by the separate argument of Theorem 2.3."
    - source: "Theorem 1.12 (b) (sub-conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_subconj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.PeriodicPoints (IFS.theorem_1_12). Part (b) treats a common fixed point by commutation and does not need the hypothesis on the original attractor."
    - source: "Theorem 1.6 (Rapaport: dimension under the ESC)"
      lean: "Challenge.audit_dim_of_esc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Rapaport assuming Rapaport's Theorem 1.2 and Corollary 1.3 (RapaportMeasureStatement, RapaportSetStatement)."
    - source: "Corollary 1.7 (open and dense set of systems without dimension drop)"
      lean: "Challenge.audit_dim_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.OpenDense assuming Rapaport's results, for N ≥ 2; Corollary 1.7 is stated for every N, and its N = 1 case is omitted here."
    - source: "The polynomial example of Section 1.2.2 (dimensions of the attractor and of self-conformal measures)"
      lean: "Challenge.audit_example_dim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Example, assuming Rapaport's results, from Theorem 1.6 after proving s(Φ) < 1 and H(p) < χ."
    - source: "Section 1.2.2, polynomial example (local dimension of the natural measure at 0)"
      lean: "Challenge.audit_example_localDim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.NaturalMeasure assuming Bowen's theorem (BowenGibbsStatement)."
    - source: "Section 1.2.2, polynomial example (L^q dimensions of the natural measure)"
      lean: "Challenge.audit_example_lq"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Lq assuming Bowen's theorem (BowenGibbsStatement). Summability and boundedness for the L^q definition remain proved in the library, outside the headline statement."

acknowledgements: >-
  Lean 4 and Mathlib (leanprover-community), the leanprover comparator, lean4export and nanoda.
