# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Sources and development details for the Lean formalisation accompanying
# "On exponential separation of analytic self-conformal sets on the real line"
# (Bárány, Kolossváry and Troscheit). Follows the mathlib-initiative formalization.yaml v0.4
# self-reporting format.

version: "v0.4"

project:
  name: "Exponential separation of analytic self-conformal sets on the real line: Lean formalisation"
  description: >-
    Lean 4 formalisation of exponential separation for analytic iterated function systems
    on the real line. Strong exponential separation holds on an open and dense subset in
    the C2 topology and follows from an explicit criterion involving dual projections.
    The development characterises conjugacy to self-similar systems and proves dimension
    consequences conditional on cited results of Rapaport and Bowen, including a drop in
    the L^q dimensions of the natural measure of a concrete three-map example.
  authors:
    - "Balázs Bárány"
    - "István Kolossváry"
    - "Sascha Troscheit"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sascha Troscheit"

classification:
  arxiv: ["math.DS", "math.CA", "math.MG"]
  msc2020: ["28A80", "37C45"]

sources:
  - title: "On exponential separation of analytic self-conformal sets on the real line"
    authors:
      - "Balázs Bárány"
      - "István Kolossváry"
      - "Sascha Troscheit"
    type: "paper"
    id: "arXiv:2509.07888v2"
    location: "arXiv:2509.07888v2, 26 March 2026: Sections 1 to 5"
    relationship: "formalizes"
    note: >-
      The paper whose results are formalised here, in the version arXiv v2 of 26 March 2026.
      paper-correspondence.yaml records the statement-by-statement correspondence with the Lean
      declarations and the points at which the Lean statements or proofs differ from the printed
      text; fidelity.divergences summarises them. The formalisation and the paper are developed
      by the same authors. A revised version of the paper incorporating these corrections is in
      preparation.
    author_endorsement: "participated"
  - title: "Dimension of self-conformal measures associated to an exponentially separated analytic IFS on R"
    authors:
      - "Ariel Rapaport"
    type: "preprint"
    id: "arXiv:2412.16753v2"
    location: "arXiv:2412.16753v2, 10 January 2025, Theorem 1.2 and Corollary 1.3"
    relationship: "background"
    note: "These results are explicit named hypotheses of the dimension endpoints; their proofs are not formalised."
  - title: "Equilibrium states and the ergodic theory of Anosov diffeomorphisms"
    authors: ["Rufus Bowen"]
    type: "book"
    location: "Lecture Notes in Mathematics 470, Springer, 1975, Theorem 1.4"
    relationship: "background"
    note: "Gibbs-measure existence for the one-sided full shift is an explicit named hypothesis."
  - title: "Dimension theory of iterated function systems"
    authors: ["De-Jun Feng", "Huyi Hu"]
    type: "paper"
    location: "Comm. Pure Appl. Math. 62 (2009), no. 11, 1435–1500, Theorem 2.8"
    relationship: "background"
    note: "Exact dimensionality is included in RapaportMeasureStatement; its proof is not formalised."
  - title: "On Furstenberg's intersection conjecture, self-similar measures, and the L^q norms of convolutions"
    authors: ["Pablo Shmerkin"]
    type: "paper"
    location: "Ann. of Math. 189 (2019), no. 2, 319–391, Lemma 1.7; DOI 10.4007/annals.2019.189.2.1"
    relationship: "background"
    note: "The required ball-mass estimate at 0 is proved in the library, not assumed."

related_formalizations: []

status:
  scope: >-
    Twelve comparator endpoints cover Theorems 1.4, 1.5, 1.6 and 1.12, Corollary 1.7 for
    N ≥ 2, Proposition 1.8, and the separation and dimension properties of the example in
    Section 1.2.2. Seven endpoints are unconditional and five use the explicit named
    literature hypotheses BowenGibbsStatement, RapaportMeasureStatement or RapaportSetStatement,
    defined in Challenge, Solution and Dimension/Defs.lean. The library also proves the
    supporting statements of Sections 2 to 5, with the qualifications in
    paper-correspondence.yaml. The N = 1 case of Corollary 1.7 is omitted. Proof counts below
    exclude the twelve intentional holes in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude Code (Anthropic)"
      tool_setup: "Agentic planning of the formalisation and set-up of the repository framework."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "agent"
      models: ["GPT-6 (OpenAI)"]
      framework: "Codex (OpenAI)"
      tool_setup: "Lean proof development and review of paper correspondence, challenge minimality and upload support files."
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Statement design and review of the Challenge statements against the paper."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    AI tools are used in the Lean development, following the principles of the Leiden
    Declaration on the responsible use of artificial intelligence in research. The authors
    review the Challenge statements against the paper and accept responsibility for the
    formalisation.

fidelity:
  divergences: >-
    The source is arXiv:2509.07888v2; theorem, section and equation numbers refer to it. Maps
    are represented by holomorphic extensions, with complex derivatives at real points. Finite
    and infinite words are separated in Challenge and represented together internally. The
    space 𝔖_N (InUnionClass) consists of the IFSs whose maps lie in S^omega_epsilon(I) for
    some epsilon > 0 depending on the system, with the C^2 metric; v2 fixes epsilon throughout.
    Theorem 1.4 and Corollary 1.7 are stated for this space, and their open and dense sets are
    relative to it. Theorem 1.6 assumes N > 0, Corollary 1.7 is restricted to N >= 2, and
    Proposition 1.8 assumes N >= 2, which v2 does not; for N = 1 its conclusion beta > 0 can
    fail. The dimensions of the example of Section 1.2.2 are deduced from Theorem 1.6 after
    proving that the attractor is not a singleton, s(Phi) < 1 and H(p) < chi, where v2 cites
    Corollary 1.7. The first claim of Theorem 1.12 is stated precisely: for every i there is an
    analytic invertible g with g' nonzero on [0,1] such that g f_i g^{-1} is a contracting
    similarity. Theorem 2.3 (b) is stated for distinct words. Lemma 2.5 (d) of v2 is not
    formalised. Lemma 2.10 is proved for all distinct words, Lemma 4.1 under the weaker
    hypothesis that compositions along distinct finite words differ on [0,1], and Lemma 5.1 for
    b != 0. Proposition 4.2 assumes f([0,1]) in (0,1) and yields g in S^omega_{epsilon'}(I) for
    some epsilon' > 0, where v2 states g in S^omega_epsilon(I); the proof chooses equal widths,
    pads an empty Z by a point of I outside Y, supplies the two second-derivative estimates
    left to the reader and obtains C = 40/m for a margin m of f. Near the interpolation points
    a product ratio is controlled by continuity instead of writing out its individual factors.
    The space analyticSpace represents the functions C^omega_epsilon([0,1]) of v2 by their
    restrictions to B_epsilon, requiring holomorphy there, continuity on its closure, which v2
    does not require, and real values on I. Restriction identifies this space with a closed
    subspace of the continuous functions on the closure of B_epsilon, where the Hutchinson
    construction is carried out. The complex form of Lemma 2.7 uses a local primitive of
    f''/f'; its real derivatives are proved equal to those of log|f'|. Theorem 2.2 is proved
    first, including the case of finite limit words, and Theorem 1.5 is deduced from it by
    compactness and Lemma 2.5 (c), using only the infinite-word part of (1.5); v2 proves
    Theorem 1.5 directly. Equation (3.3) uses norms, positive interval lengths and an eventual
    smallness condition; the absolute-value denominator |f_u'|^k and its c_min bound are
    proved and used. In the density proof of Theorem 1.4, the removal of exact overlaps by a
    small perturbation, asserted in v2, is proved by an interpolation lemma, and the invariant
    cylinder is fixed together with a d_2-neighbourhood in which its inclusions persist before
    delta and the word length are chosen. Lemma 2.6 controls the perturbed system with
    c_min/2 and a constant in (c_max, 1). Theorem 1.12 (b) treats a common fixed point by
    commutation and Theorem 2.3 treats a singleton attractor separately. Constants may
    overestimate the printed choices. Literature inputs are explicit hypotheses, not axioms: a
    one-sided full-shift specialisation of Bowen's theorem and Rapaport's results together
    with Feng–Hu exact dimensionality. The natural measure, not defined in the paper, is the
    image of any probability Gibbs measure for s(Phi) log|f'| under the natural projection.
    Lean computes its local dimension at 0, expanding the details left to the reader. The
    required ball-mass estimate of Shmerkin's Lemma 1.7 is proved here at 0 for measures
    supported on [0,infinity). Summability and boundedness needed for the L^q definition are
    proved in the library. The pressure zero is constructed using Fekete's lemma. Measure
    dimension is stated as almost everywhere local dimension. Full statement-level
    qualifications are recorded in paper-correspondence.yaml.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    Automated review compares the challenge statements and the main proof routes with
    arXiv:2509.07888v2. This is not independent human review or author approval.
    Mechanical verification of a submitted snapshot is recorded by CI and Palomar, not inferred
    from the correspondence manifest.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem 1.4 (open and dense set of systems satisfying the SESC)"
      lean: "Challenge.audit_sesc_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Generic.OpenDense, for the union class 𝔖_N of systems whose maps lie in S^ω_ε(I) for some ε > 0 depending on the system; v2 fixes ε throughout."
    - source: "Theorem 1.5 (sufficient condition for the SESC)"
      lean: "Challenge.audit_sesc_of_dualProj"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Dichotomy."
    - source: "Proposition 1.8 (explicit sufficient condition)"
      lean: "Challenge.audit_example_criterion"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Criterion, with the hypothesis N ≥ 2 added to the printed statement."
    - source: "The example of Section 1.2.2"
      lean: "Challenge.audit_example_sesc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Main.Example, with ε = 1/100."
    - source: "Theorem 1.12, first claim (conjugacy to an IFS with a similarity map)"
      lean: "Challenge.audit_conj_similarity"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.Characterisation, in the precise form of the first claim stated in Challenge."
    - source: "Theorem 1.12 (a) (conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_conj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.PeriodicPoints (IFS.theorem_1_12), along the paper's proof, which uses the hypothesis on the attractor. IFS.conjSelfSimilar_iff treats singleton attractors by the separate argument of Theorem 2.3."
    - source: "Theorem 1.12 (b) (sub-conjugacy to a self-similar IFS)"
      lean: "Challenge.audit_subconj_iff"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Conjugation.PeriodicPoints (IFS.theorem_1_12), whose part (b) applies (a) to the two-map subsystem and uses commutation for a common fixed point, a case the proof in v2 does not treat; the hypothesis on the original attractor is not needed."
    - source: "Theorem 1.6 (Rapaport: dimension under the ESC)"
      lean: "Challenge.audit_dim_of_esc"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Rapaport assuming Rapaport's Theorem 1.2 and Corollary 1.3 (RapaportMeasureStatement, RapaportSetStatement)."
    - source: "Corollary 1.7 (open and dense set of systems without dimension drop)"
      lean: "Challenge.audit_dim_open_dense"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.OpenDense assuming Rapaport's results, for N ≥ 2; the printed corollary is for every N and its N = 1 case is omitted."
    - source: "The example of Section 1.2.2 (dimensions of the attractor and of self-conformal measures)"
      lean: "Challenge.audit_example_dim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Example, assuming Rapaport's results, from Theorem 1.6 after proving s(Φ) < 1 and H(p) < χ; v2 cites Corollary 1.7."
    - source: "The remark at the end of Section 1.2.2 (local dimension of the natural measure at 0)"
      lean: "Challenge.audit_example_localDim"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.NaturalMeasure assuming Bowen's theorem (BowenGibbsStatement)."
    - source: "The end of Section 1.2.2 (L^q dimensions of the natural measure)"
      lean: "Challenge.audit_example_lq"
      module: "Challenge"
      status: "proved"
      note: "Proved in Solution from AnalyticESC.Dimension.Lq assuming Bowen's theorem (BowenGibbsStatement). Summability and boundedness for the L^q definition remain proved in the library, outside the headline statement."

acknowledgements: >-
  Lean 4 and Mathlib (leanprover-community), the leanprover comparator, lean4export and nanoda.
