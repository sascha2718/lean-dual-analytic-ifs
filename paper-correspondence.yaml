    headline: true
    note: "The polynomial example uses epsilon = 1/100, c_max < 1/5, beta <= 1 and separation 1/2 at zero. Assuming Rapaport's results, the dimension proof uses Theorem 1.6 and the coarser bound 3 c_max < 1 instead of the displayed sum 7/16."

  - source: "prose:natural-measure-example"
    kind: "prose"
    file: "analytic.tex"
    start: "We also remark that the $L^q$ dimension of the natural measure"
    end: "The full calculations are included in the accompanying Lean development."
    sha256: "45b576dae5fffa7ee29a4cc0bb76d7658f977853d31101af749e25ffeb2f0109"
    status: "formalized"
    lean: ["Challenge.audit_example_localDim", "Challenge.audit_example_lq"]
    relation: "split"
    headline: true
    note: "The natural measure is the projection of a probability Gibbs measure for s(Phi) log|f'|, assuming BowenGibbsStatement. Lean computes local dimension s(Phi)-1/3 at zero and the Lq upper bound q(s(Phi)-1/3)/(q-1), strictly below s(Phi) for q > 3s(Phi). The needed special case of Shmerkin's ball-mass estimate and the Lq summability bounds are proved internally."

  - source: "prose:non-polynomial-example"
    kind: "prose"
    file: "analytic.tex"
    start: "We chose polynomials with algebraic coefficients"
    end: "The calculations for this example are also included in the accompanying Lean development."
    sha256: "98c366a7a9052682e62ee92a9ab24fb2c3daf7afeefff9d785631bf76564072a"
    status: "formalized"
    lean: ["AnalyticESC.nonPolynomialMaps", "AnalyticESC.nonPolynomial_sesc", "AnalyticESC.nonPolynomialMaps_inClass", "AnalyticESC.nonPolynomialMaps_exists_cmax_lt", "AnalyticESC.nonPolynomialMaps_nonlin", "AnalyticESC.nonPolynomialMaps_beta_eq", "AnalyticESC.nonPolynomialMaps_nonlin_sep", "AnalyticESC.nonPolynomialMaps_fixedPoints", "AnalyticESC.nonPolynomialMaps_deriv_zero", "AnalyticESC.nonPolynomialMaps_nonlin_zero", "AnalyticESC.nonPolynomialMaps_max_deriv"]
    relation: "split"
    headline: false
    note: "The principal complex square root is holomorphic on Re z > -1. Compactness supplies a common admissible radius with c_max < 1/5. Lean proves the fixed points, matching first and pre-Schwarzian derivatives at zero, real derivative maximum 1/6, beta = 1/2, separation alpha = 1/4 at one, and SESC by Proposition 1.8. This is a library result, outside the twelve Challenge endpoints."

