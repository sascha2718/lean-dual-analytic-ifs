version: 1

manuscript_files:
  - analytic.tex

# One entry per statement environment of the manuscript. Labelled statements use their label as
# source; unlabelled ones use an `unlabelled:` identifier and are matched by count per kind.
# Status is `planned` until the Lean declarations exist, then `formalized` with the declaration
# names in `lean`. Headline entries become the Challenge endpoints listed in comparator.json.
# Source-file locations and proof-helper inventories are deliberately omitted.
entries:
  - source: "unlabelled:def-esc"
    kind: definition
    status: formalized
    lean: ["AnalyticESC.IFS.ESC"]
    relation: exact
    headline: false
    note: "Suprema over [0,1] are real iSups of bounded families."

  - source: "def:SESC"
    kind: definition
    status: formalized
    lean: ["AnalyticESC.IFS.SESC", "AnalyticESC.IFS.WeakSuperExpCondensation", "AnalyticESC.IFS.not_sesc_iff"]
    relation: split
    headline: false
    note: "The 'i.e.' of the definition, that the SESC fails exactly under weak super-exponential condensation, is AnalyticESC.IFS.not_sesc_iff; the positive sequence eta and the strictly increasing subsequence are explicit."

  - source: "unlabelled:def-exact-overlaps"
    kind: definition
    status: formalized
    lean: ["AnalyticESC.IFS.HasExactOverlaps"]
    relation: representation
    headline: false
    note: "The attractor is AnalyticESC.IFS.attractor, defined as the range of the natural projection, which the paper identifies with the Hutchinson attractor."

  - source: "thm:ESCOpenDense"
    kind: theorem
    status: formalized
    lean: ["Challenge.audit_sesc_open_dense"]
    relation: exact
    headline: true
    note: "Library form AnalyticESC.theorem_1_4. The space of IFSs is the union class AnalyticESC.InUnionClass, with the d2 metric between families (AnalyticESC.d2Sys); open and dense are relative to this space. The open set consists of the systems whose dual IFS satisfies the SSC, as in the paper, and of all systems when N = 0, where the dual attractor would be empty. The interpolation at the start of the paper's density proof is the internal lemma AnalyticESC.IFS.lemma_4_2, which uses complex analyticity in the parameter and preserves the fixed-epsilon class. Density then uses AnalyticESC.IFS.lemma_4_3 (Lemma 4.1), Proposition 4.2 and AnalyticESC.IFS.exists_dualSSC_near; openness uses AnalyticESC.IFS.lemma_2_6_union. The density proof fixes a strictly invariant cylinder and uses its d2 continuity neighbourhood (AnalyticESC.IFS.exists_invariant_cylinder_near) before choosing delta and the word length, as in the manuscript."

  - source: "thm:main"
    kind: theorem
    status: formalized
    lean: ["Challenge.audit_sesc_of_dualProj"]
    relation: exact
    headline: true
    note: "Library form AnalyticESC.IFS.theorem_1_5, over finite and infinite words (AnalyticESC.Word). The challenge splits the hypothesis into finite words of equal length and infinite words, which are the pairs of equal length. Maps are holomorphic extensions; H_w is evaluated at real points with complex derivatives, which equal the real ones there. The paper deduces the theorem from Theorem 2.2 by compactness and Lemma 2.5 (c), using only the infinite words of (1.5). Lean now follows this deduction: AnalyticESC.IFS.dualProj_ne_iff_exists_delta supplies the compactness step, followed by Lemma 2.5(c) and Theorem 2.2; only the infinite-word hypothesis is used."

  - source: "thm:RapaportMain"
    kind: theorem
    status: formalized
    lean: ["Challenge.audit_dim_of_esc"]
    relation: representation
    headline: true
    note: "Derived in AnalyticESC.IFS.theorem_1_6 from Rapaport's Theorem 1.2 and Corollary 1.3 (arXiv:2412.16753), which the audited statement takes as the hypotheses RapaportMeasureStatement and RapaportSetStatement, stated for real analytic maps of [0,1] as in his paper. Equality in (1.6) is AnalyticESC.IFS.DimEquality: the pressure has a unique zero s(Phi) and dim_H of the attractor is min{1, s(Phi)}; for each positive probability vector p, the self-conformal measure has local dimension min{1, H(p)/chi} almost everywhere (exact dimensionality, Feng and Hu, is part of RapaportMeasureStatement). The statement assumes N > 0; the remark after the theorem, that the attractor is a singleton exactly when the maps have a common fixed point, is AnalyticESC.IFS.exists_attractor_eq_singleton_iff."

  - source: "cor:dim"
    kind: corollary
    status: formalized
    lean: ["Challenge.audit_dim_open_dense"]
    relation: representation
    headline: true
    note: "AnalyticESC.corollary_1_7, for N >= 2, assuming Rapaport's results, and Theorem 1.4. The paper states the corollary for every N; the case N = 1, where the assertion is trivial, is not formalised. The open set is the open set of Theorem 1.4 intersected with the systems having two maps with distinct fixed points, which is open and dense in the union class for N >= 2. Equality in (1.6) is AnalyticESC.IFS.DimEquality, as for thm:RapaportMain."

  - source: "prop:example"
    kind: proposition
    status: formalized
    lean: ["Challenge.audit_example_criterion", "Challenge.audit_example_sesc", "Challenge.audit_example_dim", "Challenge.audit_example_localDim", "Challenge.audit_example_lq"]
    relation: split
    headline: true
    note: "The proposition is AnalyticESC.IFS.proposition_1_8, with beta as AnalyticESC.IFS.beta. The example after the proof is AnalyticESC.example_sesc, with epsilon = 1/100: AnalyticESC.exampleIFS has c_max < 1/5 (exampleIFS_cmax_lt), beta <= 1 (exampleIFS_beta_le) and distortions 1/2 apart at 0 (exampleIFS_nonlin_sep). The challenge splits the conclusion over finite and infinite words, as for Theorem 1.5. The dimensions of the example, dim_H of the attractor = s(Phi) < 1 and dim mu_p = H(p)/chi < 1, are AnalyticESC.example_dim, from Theorem 1.6, as in the manuscript; Lean obtains s(Phi) < 1 and H(p) < chi from 3 c_max < 1. The remark at the end of Section 1.2.2 says that the local dimension at 0 of the natural measure is smaller than s(Phi) and deduces the drop of its L^q dimensions by contradiction from Shmerkin's Lemma 1.7, leaving the details to the reader. Lean computes the local dimension s(Phi) - 1/3 at 0 (AnalyticESC.example_localDim_of_bowen) and proves D_mu(q) <= q (s(Phi) - 1/3)/(q - 1) < s(Phi) for q > 3 s(Phi) (AnalyticESC.example_lq_of_bowen) by contradiction using the ball-mass estimate of Shmerkin's Lemma 1.7. The required estimate at 0 for a measure supported on [0,infinity) is proved as AnalyticESC.shmerkin_ball_bound_zero, and AnalyticESC.lqDim_le_of_localDim applies it to the local dimension. These two lemmas need no literature hypotheses; the example endpoints assume Bowen's theorem (BowenGibbsStatement). The paper does not define the natural measure; Lean takes the image under pi of a Gibbs measure in Bowen's sense of s(Phi) log|f'_{omega_0}(pi(sigma omega))|. AnalyticESC.example_lq_of_bowen also proves summability and boundedness for the L^q definition; these internal checks are omitted from the Challenge endpoint."

  - source: "def:conjugation"
    kind: definition
    status: formalized
    lean: ["AnalyticESC.IsAnalyticCoord", "AnalyticESC.ConjSelfSimilar"]
    relation: representation
    headline: false
    note: "Analytic means analytic on a neighbourhood of each point of [0,1]; invertible means injective on [0,1], as in the paper. Conjugacy to a self-similar IFS is stated as g(f_j(x)) = lambda_j g(x) + t_j on [0,1], which is equivalent for injective g."

  - source: "unlabelled:def-subconjugated"
    kind: definition
    status: formalized
    lean: ["AnalyticESC.IFS.SubConjSelfSimilar"]
    relation: representation
    headline: false
    note: "Words of the same length are maps Fin m -> Fin N; distinctness excludes m = 0."

  - source: "thm:SubConjugation"
    kind: theorem
    status: formalized
    lean: ["Challenge.audit_conj_similarity", "Challenge.audit_conj_iff", "Challenge.audit_subconj_iff"]
    relation: split
    headline: true
    note: "Library forms AnalyticESC.IFS.theorem_1_12_similarity and AnalyticESC.IFS.theorem_1_12 (module Conjugation.PeriodicPoints). Part (a) follows the paper's proof: the zero set of g' is invariant under the maps and contains the infinite attractor, so g' != 0 (AnalyticESC.IFS.deriv_ne_zero_of_conj_of_nonsingleton); at the fixed point of f_w, g''/g' = H_{reversed w}/(1 - f_w') (AnalyticESC.IFS.deriv_deriv_div_deriv_eq_of_fixedPoint); the limit along the fixed points of i_1...i_n j_n...j_1 gives g''/g' = H_j on the attractor (AnalyticESC.IFS.dualProj_eq_of_conjSelfSimilar); the converse applies Lemma 5.1 to each map (AnalyticESC.IFS.conjSelfSimilar_of_dualProj_eq). Part (b) is AnalyticESC.IFS.subConjSelfSimilar_iff. It applies part (a) to the two-map subsystem when the fixed points differ and treats a common fixed point by commutation (AnalyticESC.comp_comm_of_conj), as in the manuscript. Its converse uses the common ODE solution. AnalyticESC.IFS.conjSelfSimilar_iff extends part (a) by the separate singleton argument of Theorem 2.3. Periodic words are AnalyticESC.periodic."

  - source: "lem:ExistanceAttractor"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.existsUnique_isDualAttractor"]
    relation: representation
    headline: false
    note: "C^omega_eps([0,1]) is AnalyticESC.analyticSpace, the restrictions to B_eps of maps holomorphic there, continuous on its closure and real on I, with the topology of uniform convergence on B_eps, as in the manuscript. Existence and uniqueness follow from Hutchinson's theorem, proved here by the contraction principle on nonempty compact sets (AnalyticESC.existsUnique_compact_invariant). AnalyticESC.ClosedAnalyticSpace.Space is the closed, complete space of continuous functions on the closure of B_eps that are holomorphic inside and real on I; restriction identifies it with analyticSpace. The coding description is then proved for this attractor. The hypothesis 0 < N is the paper's implicit assumption that the IFS has a map."

  - source: "thm:DualSSC"
    kind: theorem
    status: formalized
    lean: ["AnalyticESC.IFS.theorem_2_2"]
    relation: exact
    headline: false
    note: "The proof uses the internal lemma AnalyticESC.IFS.condensation_dichotomy, whose hypothesis is the failure of the SESC, equivalent to weak super-exponential condensation by AnalyticESC.IFS.not_sesc_iff. The proof follows the three manuscript cases: bounded common suffixes give a fixed nondegenerate image interval; finite limit words use finite order of vanishing; infinite limit words use (3.2), (3.3), the common-prefix bounds and analyticity. Composition derivative bounds come from (2.10) and Lemma 2.8. Equation (3.3), including its absolute-value denominator, is AnalyticESC.IFS.norm_iteratedDeriv_sub_le_on_image and is used in the infinite branch. The smallness condition required to iterate Lemma 3.1 holds eventually, which suffices after discarding finitely many indices. Constants are allowed to be larger than the displayed manuscript constants."

  - source: "thm:DualConj"
    kind: theorem
    status: formalized
    lean: ["AnalyticESC.IFS.theorem_2_3_conj", "AnalyticESC.IFS.theorem_2_3_subconj"]
    relation: split
    headline: false
    note: "The dual attractor is the unique AnalyticESC.IFS.IsDualAttractor; F_i on C^omega_eps([0,1]) is AnalyticESC.IFS.dualCompOn, and the common fixed point h lies in AnalyticESC.analyticSpace (see lem:ExistanceAttractor). The non-singleton case uses Theorem 1.12(a). The singleton case is proved separately in AnalyticESC.IFS.dualProj_eq_of_conjSelfSimilar_singleton: commutativity and the limit (5.2) give a common linearising map (AnalyticESC.koenigs_commuting), then differentiating twice identifies its logarithmic derivative with the common dual fixed point. Part (b) uses Theorem 1.12(b), whose proof does not require a non-singleton attractor. The hypothesis 0 < N is the paper's implicit assumption that the IFS has a map; AnalyticESC.IFS.theorem_2_3_subconj does not use it."

  - source: "thm:H_iAnalytic"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.dualProj_mem_analyticSpace", "AnalyticESC.IFS.exists_dualProj_holder", "AnalyticESC.IFS.isDualAttractor_range"]
    relation: split
    headline: false
    note: "The three claims: H_i lies in C^omega_eps([0,1]) (AnalyticESC.analyticSpace), the Hoelder bound on B_eps, and that {H_i : i in Sigma} is a dual attractor, hence the attractor by AnalyticESC.IFS.existsUnique_isDualAttractor. Boundary continuity is proved by uniform convergence of the defining series on the closure of B_eps (AnalyticESC.IFS.continuousOn_dualProj)."

  - source: "lem:SSCEequiv"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.lemma_2_5", "AnalyticESC.IFS.dualSSC_iff_exists_delta", "AnalyticESC.IFS.dualSSC_iff_ne"]
    relation: split
    headline: false
    note: "The cylinder set (k,K) is AnalyticESC.dualCyl and its closure is represented by AnalyticESC.dualCylClosed, the maps with values in [k,K] on [0,1]. Disjointness of cylinders is the pointwise condition (2.2). The proof of (a) => (b) follows the compactness contradiction in the manuscript: extend intersecting finite-word cylinders to infinite words, extract a convergent subsequence of pairs, and use shrinking cylinder widths to identify the limiting dual projections. The cylinder definitions include continuity on the closure of B_eps."

  - source: "lem:cont"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.lemma_2_6", "AnalyticESC.IFS.lemma_2_6_union", "AnalyticESC.IFS.exists_dualProj_sub_le_d2"]
    relation: split
    headline: false
    note: "The estimate (2.6) holds for all finite and infinite words. As in the paper, the perturbed system is controlled with the constants c_min/2 and a constant in (c_max, 1). The radius depends only on Phi, and the perturbed system may lie in S^omega_eps' for any eps' (lemma_2_6_union)."

  - source: "thm:ugly"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.lemma_2_7", "AnalyticESC.IFS.iteratedDeriv_comp_div_deriv", "AnalyticESC.gPoly", "AnalyticESC.IFS.dualDerivTerm"]
    relation: representation
    headline: false
    note: "The polynomials g_k are AnalyticESC.gPoly with integer coefficients, the variable X l standing for H^(l); the partitions of {1, ..., k+1} are Mathlib's OrderedFinpartition (k + 1), with blocks ordered by their greatest element; phi_i^(m) is written as the (m-1)-th derivative of f_i''/f_i'. The identity (2.10) is AnalyticESC.IFS.iteratedDeriv_comp_div_deriv. The Lean statement also asserts convergence of the series for infinite words. The complex Faà di Bruno formula uses a local primitive of f_i''/f_i'; AnalyticESC.IFS.iteratedDeriv_logAbsDeriv proves that its positive-order real derivatives are precisely those of log|f_i'|. Termwise differentiation is justified by locally uniform convergence on B_eps. Lemmas 2.8 and 2.10 now depend on this formula."

  - source: "thm:kbound"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.lemma_2_8"]
    relation: exact
    headline: false
    note: "Proved by induction on the derivative order from the Faà di Bruno formula of Lemma 2.7, polynomial bounds and a geometric series (AnalyticESC.IFS.exists_dualDerivTerm_bound and AnalyticESC.IFS.exists_iteratedDeriv_bounds). The constants may overestimate the manuscript's choices."

  - source: "thm:difcor"
    kind: corollary
    status: formalized
    lean: ["AnalyticESC.IFS.corollary_2_9"]
    relation: exact
    headline: false
    note: "Holds for any constants C_k as in Lemma 2.8; the hypothesis k >= 1 is not needed."

  - source: "thm:difbound"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.lemma_2_10"]
    relation: exact
    headline: false
    note: "Stated, as in the paper, for distinct finite or infinite words, with one family of constants C_k that also satisfies Lemma 2.8. AnalyticESC.IFS.exists_iteratedDeriv_bounds cancels the common prefix in the series of Lemma 2.7 and bounds the remaining geometric tails, for every common prefix length m <= |i ∧ j|."

  - source: "thm:analyticity"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.lemma_3_1"]
    relation: exact
    headline: false
    note: "AnalyticESC.abs_deriv_sub_le_of_abs_sub_le is the C^2 form with any common bound Q, and AnalyticESC.abs_iteratedDeriv_sub_le its iterate."

  - source: "lem:Pointsx_ij"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.IFS.lemma_4_3", "AnalyticESC.IFS.noCoincidence_of_not_hasExactOverlaps"]
    relation: exact
    headline: false
    note: "The hypothesis is AnalyticESC.IFS.NoCoincidence. Orbits are lists of real points; item (c) is stated for distinct pairs of B_n."

  - source: "prop:AnalyticBumpFunc"
    kind: proposition
    status: formalized
    lean: ["AnalyticESC.proposition_4_2"]
    relation: exact
    headline: false
    note: "AnalyticESC.proposition_4_2 (module Generic.MultiplicativeBump) follows the paper's proof: g = f exp(phi psi A), the amplitudes (4.4), widths subject to (C1) to (C4), (4.5) and (4.6), the bound (4.3) (AnalyticESC.gaussian_bound), and g in S^omega(I) by AnalyticESC.exists_inClass. All widths are equal, eta_i = rho^3. As in the repaired manuscript, an empty Z is padded by a point of I outside Y; the original factors 16Q^2 + 12Q and 8Q then apply. Lean supplies the bounds for phi psi A'' and phi' psi A', which the paper leaves to the reader: they are of order delta near Y, and need (4.3) with c = 4M a_y for the off-diagonal part of phi' psi A' and an analogue of (4.6) with exp(-eta^(-1/3)/2). Near y_i the ratio of psi times the product over Y to its value at y_i is bounded by continuity. The constant is C = 40/m for a margin m of f on [0,1]. The paper's epsilon is eta."

  - source: "unlabelled:lem-gaussian-bound"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.gaussian_bound"]
    relation: exact
    headline: false
    note: "Used in the proof of Proposition 4.2 (AnalyticESC.proposition_4_2)."

  - source: "lem:conj0"
    kind: lemma
    status: formalized
    lean: ["AnalyticESC.lemma_5_1", "AnalyticESC.existsUnique_fixedPoint"]
    relation: split
    headline: false
    note: "The map g is a + b g_hat for the linearising map g_hat of (5.2), AnalyticESC.koenigs. Lean defines g_hat by the double integral of H_hat_f, proves its ODE and boundary continuity, integrates the finite logarithmic derivatives to get the derivative-product identity, and derives (5.2) by passing the limit through the outer integral. Shifting the limit gives the conjugacy equation, as in the manuscript. Invertibility means injectivity of the real restriction on [0,1], and g lies in AnalyticESC.analyticSpace, including continuity on the closure of B_eps (AnalyticESC.continuousOn_koenigs). The second part assumes g twice differentiable within [0,1], with one-sided derivatives at the end points, and follows the paper. H_hat_f of (5.1) is AnalyticESC.hatH."
